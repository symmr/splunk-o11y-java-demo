name: o11y-demo

x-app-cpus: &demo-cpuset ${DEMO_CPUSET:-0}

# Rotate container logs so log-noise cannot fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    # pg_stat_statements is required by Database Monitoring (top queries / execution plans).
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_activity_query_size=4096
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U shop -d shop"]  # TCP: not ready while init scripts run
      interval: 5s
      timeout: 3s
      retries: 60
    logging: *default-logging
    restart: unless-stopped

  # Keeps the database at its seeded size: deletes orders placed by the load generator
  # once they are older than DB_RETENTION_MINUTES. Runs psql directly, so it never shows up in APM.
  db-janitor:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGUSER: shop
      PGPASSWORD: shop
      PGDATABASE: shop
      RETENTION_MINUTES: ${DB_RETENTION_MINUTES:-60}
    command:
      - sh
      - -c
      - |
        while true; do
          psql -q -v ON_ERROR_STOP=1 -v minutes="$$RETENTION_MINUTES" <<'SQL' || echo "db-janitor: cleanup failed"
        WITH old AS (
          SELECT id FROM orders WHERE id > 300000 AND created_at < now() - make_interval(mins => :minutes)
        ), items AS (
          DELETE FROM order_items WHERE order_id IN (SELECT id FROM old)
        )
        DELETE FROM orders WHERE id IN (SELECT id FROM old);
        SQL
          sleep 600
        done
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  app:
    build:
      context: ./app
      args:
        # Old middleware on purpose (Secure Application demo). Set to a fixed version to remediate.
        TOMCAT_VERSION: ${DEMO_TOMCAT_VERSION:-10.1.34}
        POSTGRESQL_VERSION: ${DEMO_POSTGRESQL_VERSION:-42.7.1}
    image: o11y-demo/shop-app:latest
    # app and noisy-neighbor are pinned to the same core(s) so the neighbor really hurts.
    cpuset: *demo-cpuset
    ports:
      - "${APP_PORT:-52731}:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/shop
      DB_USER: shop
      DB_PASSWORD: shop
      PAYMENT_URL: http://payment-gateway:8081
      OTEL_SERVICE_NAME: ${SERVICE_NAME:-shop-app}
      # service.namespace is required by Secure Application.
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=${DEPLOYMENT_ENV:-o11y-demo},service.version=1.0.0,service.namespace=${SERVICE_NAMESPACE:-o11y-demo-shop}
      # Secure Application: report attack events (Java 8-23).
      JAVA_TOOL_OPTIONS: "-Dargento.allow.security.events=true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      # External dependency shows up as an inferred service on the service map.
      OTEL_INSTRUMENTATION_COMMON_PEER_SERVICE_MAPPING: payment-gateway=payment-gateway
      SPLUNK_PROFILER_ENABLED: "true"
      SPLUNK_PROFILER_MEMORY_ENABLED: "true"
      SPLUNK_PROFILER_CALL_STACK_INTERVAL: "1000"
      # Database Monitoring <-> APM correlation (sets application_name per JDBC session).
      OTEL_INSTRUMENTATION_SPLUNK_JDBC_ENABLED: "true"
      CHAOS_AUTO_OFF_MINUTES: ${CHAOS_AUTO_OFF_MINUTES:-30}
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    logging: *default-logging
    restart: unless-stopped

  payment-gateway:
    build: ./sidecars/payment-mock
    image: o11y-demo/payment-gateway:latest
    environment:
      CHAOS_URL: http://app:8080/chaos/api/scenarios/external-latency
    logging: *default-logging
    restart: unless-stopped

  noisy-neighbor:
    build: ./sidecars/noisy-neighbor
    image: o11y-demo/noisy-neighbor:latest
    cpuset: *demo-cpuset
    # A batch job someone started with a much higher CPU weight than the app (default 1024).
    cpu_shares: 10240
    environment:
      CHAOS_URL: http://app:8080/chaos/api/scenarios/noisy-neighbor
    logging: *default-logging
    restart: unless-stopped

  otel-collector:
    image: quay.io/signalfx/splunk-otel-collector:${SPLUNK_OTEL_COLLECTOR_VERSION:-0.163.0}
    command: ["--config=/etc/otel/config.yaml"]
    user: "0:0"
    pid: host
    environment:
      SPLUNK_REALM: ${SPLUNK_REALM:?set SPLUNK_REALM in .env}
      SPLUNK_ACCESS_TOKEN: ${SPLUNK_ACCESS_TOKEN:?set SPLUNK_ACCESS_TOKEN in .env}
      SPLUNK_HEC_URL: ${SPLUNK_HEC_URL:?set SPLUNK_HEC_URL in .env}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN:?set SPLUNK_HEC_TOKEN in .env}
      SPLUNK_HEC_INDEX: ${SPLUNK_HEC_INDEX:-main}
      SPLUNK_HEC_TLS_INSECURE: ${SPLUNK_HEC_TLS_INSECURE:-false}
      DEMO_HOST_NAME: ${DEMO_HOST_NAME:-o11y-demo-host}
      # Same value as the app's service.namespace; the collector adds it to telemetry that does not have one.
      SERVICE_NAMESPACE: ${SERVICE_NAMESPACE:-o11y-demo-shop}
      SPLUNK_MEMORY_TOTAL_MIB: "1024"
      # smartagent/processlist (Infrastructure > host > Processes tab) reads the host's /proc via /hostfs.
      HOST_PROC: /hostfs/proc
      HOST_ETC: /hostfs/etc
      HOST_VAR: /hostfs/var
      HOST_RUN: /hostfs/run
      HOST_SYS: /hostfs/sys
    volumes:
      - ./collector/config.yaml:/etc/otel/config.yaml:ro
      - /:/hostfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  loadgen:
    image: grafana/k6:${K6_VERSION:-1.0.0}
    command: ["run", "--quiet", "/scripts/load.js"]
    environment:
      BASE_URL: http://app:8080
      LOAD_MULTIPLIER: ${LOAD_MULTIPLIER:-1}
    volumes:
      - ./loadgen:/scripts:ro
    depends_on:
      - app
    logging: *default-logging
    restart: unless-stopped

volumes:
  pgdata:
