<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chaos Control</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1d2330; --muted:#667085; --on:#d92d20; --line:#e4e7ec; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151b; --card:#1b2029; --fg:#e6e9ef; --muted:#98a2b3; --on:#f97066; --line:#2c3340; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px; max-width:960px; margin:0 auto; }
  h1 { font-size:18px; margin:0; }
  main { max-width:960px; margin:0 auto; padding:0 16px 32px; display:grid; gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .card.on { border-color:var(--on); box-shadow: inset 4px 0 0 var(--on); }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .title { font-weight:600; }
  .id { color:var(--muted); font-family: ui-monospace, monospace; font-size:12px; }
  .desc { color:var(--muted); margin:6px 0 10px; }
  .slider { display:flex; align-items:center; gap:10px; }
  .slider input { flex:1; }
  .hint { color:var(--muted); font-size:12px; }
  button { font:inherit; padding:6px 12px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
  .switch { position:relative; width:46px; height:26px; flex:none; }
  .switch input { opacity:0; width:0; height:0; }
  .switch span { position:absolute; inset:0; border-radius:13px; background:var(--line); transition:.15s; }
  .switch span::after { content:""; position:absolute; width:20px; height:20px; left:3px; top:3px; border-radius:50%; background:#fff; transition:.15s; }
  .switch input:checked + span { background:var(--on); }
  .switch input:checked + span::after { transform:translateX(20px); }
  #status { color:var(--muted); font-size:12px; }
  details.presets { max-width:960px; margin:0 auto 12px; padding:0 16px; }
  details.presets summary { cursor:pointer; font-weight:600; padding:6px 0; }
  .preset { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .preset p { margin:4px 0 0; color:var(--muted); }
  .preset button { white-space:nowrap; flex:none; }
  .preset code { font-size:12px; }
  .warn { border-color:var(--on); }
  .autooff { max-width:928px; margin:0 auto 12px; display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
  .autooff input { width:80px; font:inherit; padding:5px 8px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
</style>
</head>
<body>
<header>
  <h1>Chaos Control <span id="status"></span></h1>
  <button id="reset">すべてOFF</button>
</header>
<section class="card autooff">
  <label for="autoOffMinutes"><strong>自動OFFまでの時間</strong></label>
  <input id="autoOffMinutes" type="number" min="0" max="1440" step="1" value="30">
  <span>分</span>
  <button id="autoOffApply">設定</button>
  <span class="hint" id="autoOffHint">ONにした時点からの時間。0で自動OFFなし。変更はこれからONにする障害に適用（動作中のタイマーは変わりません）</span>
</section>
<details class="presets">
  <summary>応用: 組み合わせ例（実測値は4コアのホスト、既定の負荷。ボタンは他の障害をOFFにしてから適用）</summary>
  <div id="presets" style="display:grid; gap:8px; margin-top:8px;"></div>
</details>
<main id="list"></main>
<script>
const api = "/chaos/api";
const presets = [
  { title: "原因が2つ（DBと外部API）", set: { "slow-query": 100, "external-latency": 20 },
    note: "検索 約2.4s・注文 約0.7s。検索はDB Monitoringの実行計画、注文はService Mapの payment-gateway と、別々の原因に辿り着く" },
  { title: "原因が2つ（コードとインフラ）", set: { "cpu-hotspot": 30, "noisy-neighbor": 50 },
    note: "全APIが3〜4倍。flame graphの PriceCalculator だけで結論しがちだが、ホストCPUを noisy-batch も食っている" },
  { title: "連鎖でDB全滅", set: { "slow-query": 100, "pool-exhaustion": 80 },
    note: "検索は8割が503、他APIも約1s＋一部503。実行計画の Seq Scan と idle in transaction が同時に見える" },
  { title: "一気にOOM", set: { "gc-pressure": 50, "memory-leak": 20 },
    note: "約45秒でOOM→再起動（単独だと数分〜10分）。再起動で全障害がOFFに戻る" },
  { title: "ノイズに埋もれたエラー", set: { "log-noise": 50, "external-latency": 30 },
    note: "決済失敗のERRORが大量のWARNに埋もれる。トレースから関連ログに飛べば一発（未計測）" },
];

function renderPresets() {
  const box = document.getElementById("presets");
  const warn = document.createElement("section");
  warn.className = "card warn";
  warn.innerHTML = "<strong>やってはいけない:</strong> cpu-hotspot と noisy-neighbor を既定の強度のまま重ねると、アプリが応答しなくなり、この画面も効かなくなります。止めるには <code>docker compose stop noisy-neighbor</code>（30秒ほどで自動停止もします）。";
  box.appendChild(warn);
  for (const p of presets) {
    const card = document.createElement("section");
    card.className = "card preset";
    const text = document.createElement("div");
    const title = document.createElement("div");
    title.className = "title";
    title.textContent = p.title;
    const set = document.createElement("code");
    set.textContent = Object.entries(p.set).map(([id, i]) => `${id}=${i}`).join("  ");
    const note = document.createElement("p");
    note.textContent = p.note;
    text.append(title, set, note);
    const btn = document.createElement("button");
    btn.textContent = "この組み合わせでON";
    btn.addEventListener("click", async () => {
      status.textContent = "更新中…";
      await fetch(api + "/reset", { method: "POST" });
      for (const [id, intensity] of Object.entries(p.set)) {
        await fetch(`${api}/scenarios/${id}`, {
          method: "PUT", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ enabled: true, intensity })
        });
      }
      status.textContent = "";
      load();
    });
    card.append(text, btn);
    box.appendChild(card);
  }
}
renderPresets();
const list = document.getElementById("list");
const status = document.getElementById("status");

async function load() {
  const res = await fetch(api + "/scenarios");
  render(await res.json());
}

function render(scenarios) {
  list.innerHTML = "";
  for (const s of scenarios) {
    const card = document.createElement("section");
    card.className = "card" + (s.enabled ? " on" : "");
    card.innerHTML = `
      <div class="row">
        <div><div class="title"></div><div class="id"></div></div>
        <label class="switch"><input type="checkbox"><span></span></label>
      </div>
      <div class="desc"></div>
      <div class="slider">
        <input type="range" min="1" max="100">
        <output></output>
      </div>
      <div class="hint"></div>`;
    card.querySelector(".title").textContent = s.title;
    card.querySelector(".id").textContent = s.id;
    card.querySelector(".desc").textContent = s.description;
    card.querySelector(".hint").textContent = "intensity: " + s.intensityHint + autoOffText(s);
    const toggle = card.querySelector("input[type=checkbox]");
    const range = card.querySelector("input[type=range]");
    const out = card.querySelector("output");
    toggle.checked = s.enabled;
    range.value = s.intensity;
    out.textContent = s.intensity;
    range.addEventListener("input", () => out.textContent = range.value);
    range.addEventListener("change", () => update(s.id, { intensity: Number(range.value) }));
    toggle.addEventListener("change", () => update(s.id, { enabled: toggle.checked, intensity: Number(range.value) }));
    list.appendChild(card);
  }
}

function autoOffText(s) {
  if (!s.enabled || !s.autoOffAt) return "";
  const min = Math.max(0, Math.ceil((new Date(s.autoOffAt) - Date.now()) / 60000));
  return ` ／ あと約${min}分で自動OFF（ONし直すと延長）`;
}

async function update(id, body) {
  status.textContent = "更新中…";
  await fetch(`${api}/scenarios/${id}`, {
    method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
  });
  status.textContent = "";
  load();
}

document.getElementById("reset").addEventListener("click", async () => {
  await fetch(api + "/reset", { method: "POST" });
  load();
});

const autoOffInput = document.getElementById("autoOffMinutes");
async function loadSettings() {
  const res = await fetch(api + "/settings");
  autoOffInput.value = (await res.json()).autoOffMinutes;
}
async function applyAutoOff() {
  const minutes = Math.max(0, Math.min(1440, Math.round(Number(autoOffInput.value) || 0)));
  status.textContent = "更新中…";
  const res = await fetch(api + "/settings", {
    method: "PUT", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ autoOffMinutes: minutes })
  });
  autoOffInput.value = (await res.json()).autoOffMinutes;
  status.textContent = "";
}
document.getElementById("autoOffApply").addEventListener("click", applyAutoOff);
autoOffInput.addEventListener("keydown", e => { if (e.key === "Enter") applyAutoOff(); });
loadSettings().catch(() => {});

load().catch(() => status.textContent = "APIに接続できません");
setInterval(() => document.activeElement?.type === "range" || load().catch(() => status.textContent = "APIに接続できません（再起動中？）"), 5000);
</script>
</body>
</html>
